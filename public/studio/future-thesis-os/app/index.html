<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Future Thesis turns scattered signals into testable views of where technology and industry are heading.">
<meta name="robots" content="noindex, nofollow">
<title>Future Thesis: world model</title>
<style>
@font-face {
  font-family: "Archivo";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/archivo-latin.woff2") format("woff2-variations");
  unicode-range:
    U+0000-00ff, U+0131, U+0152-0153, U+02bb-02bc, U+02c6, U+02da, U+02dc, U+0304, U+0308, U+0329,
    U+2000-206f, U+20ac, U+2122, U+2191, U+2193, U+2212, U+2215, U+feff, U+fffd;
}
@font-face {
  font-family: "Archivo";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/archivo-latin-ext.woff2") format("woff2-variations");
  unicode-range:
    U+0100-02ba, U+02bd-02c5, U+02c7-02cc, U+02ce-02d7, U+02dd-02ff, U+0304, U+0308, U+0329,
    U+1d00-1dbf, U+1e00-1e9f, U+1ef2-1eff, U+2020, U+20a0-20ab, U+20ad-20c0, U+2113, U+2c60-2c7f,
    U+a720-a7ff;
}

/* ══════════════════════════════════════════════════════════════
   Ported from the project's own DESIGN.md (v1, 2026-09-04): cold
   neutrals, one cobalt accent, hairlines instead of boxes.

   Two deliberate departures from that spec. Archivo carries every
   role — the site this board is embedded in loads one face, and a
   second family for one iframe is not worth 40 KB — so the serif /
   sans duality is rebuilt out of weight, size and letter-spacing.
   And the exhibit is a frozen English snapshot, so nothing here is
   bilingual.

   Single light world, per the spec. The old sheet defaulted to dark
   and flipped on prefers-color-scheme, which put a black board under
   the always-light page that frames it.
   ══════════════════════════════════════════════════════════════ */
:root{
  color-scheme:light;

  /* Neutrals — cold, blue-leaning. Names kept from the old sheet so
     the drawing code, which reads them through var(), needs no edit. */
  --ground:#F5F7FA; --surface:#FFFFFF; --surface-2:#EDF1F5; --raise:#FFFFFF;
  --ink:#0E1A2B; --ink-dim:#46546A; --muted:#7C8798;
  --line:#E1E6EC; --line-2:#CBD3DD;

  /* One accent. `--accent` is the reading colour (links, active text);
     `--accent-2` is the data colour and appears only on marks. */
  --accent:#1C5CAB; --accent-2:#2A78D6; --accent-hover:#104281;
  --accent-soft:#DBE8FA; --accent-wash:rgba(42,120,214,.08);

  /* Polarity, always paired with an arrow and a word. */
  --up:#2A78D6; --down:#EB6834; --flat:#7C8798;

  /* Trend status is set in words, not colour — these resolve to the
     ink ramp so the drawing code keeps working. Falsified is the one
     exception: it is a verdict, not a shade of the same thing. */
  --st-emerging:#7C8798; --st-strength:#7C8798; --st-main:#46546A;
  --st-loose:#7C8798; --st-fals:#EB6834;

  /* Graph node roles. A map is the one place the spec allows data
     colour on marks, but it is still one hue plus the polarity pair. */
  --bottleneck:#EB6834; --driver:#2A78D6; --pat:#7C8798; --ext:#CBD3DD;

  /* The drawing code still passes a per-kind fill for the meter. One data
     colour now, so both resolve to it and `.bar>i` overrides either way —
     defined here only so no inline style references a dangling variable. */
  --mark-scen:var(--accent-2); --mark-chain:var(--accent-2);

  --shadow-1:0 1px 2px rgba(14,26,43,.04),0 8px 24px -12px rgba(14,26,43,.18);
  --shadow-2:0 2px 6px rgba(14,26,43,.06),0 16px 40px -16px rgba(14,26,43,.28);
  --shadow-3:-24px 0 60px -28px rgba(14,26,43,.35);
  --shadow:var(--shadow-1);

  --radius-sm:6px; --radius-md:12px; --radius-pill:999px;

  /* One family: Archivo. IDs, probabilities and counts inherit this
     face — they are not a second typeface. */
  --font:"Archivo", system-ui, sans-serif;
  --mono:var(--font); --sans:var(--font);

  --text-xs:12px; --text-sm:13.5px; --text-base:15px; --text-md:17px;
  --text-lg:20px; --text-xl:24px; --text-2xl:30px;

  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px;
  --space-6:32px; --space-7:40px; --space-8:48px; --space-9:64px; --space-10:96px;

  --ease:cubic-bezier(.2,.7,.2,1); --dur-1:150ms; --dur-2:300ms;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:var(--text-base);line-height:1.7;
  font-synthesis-weight:none;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  font-variant-numeric:lining-nums}
.mono{font-family:inherit;font-variant-numeric:lining-nums tabular-nums}
.wrap{max-width:1200px;margin:0 auto;padding:0 clamp(20px,4vw,48px)}
a{color:var(--accent)}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance;letter-spacing:-.01em;line-height:1.2}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--accent-soft);color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--radius-sm)}

/* ---------- Header ---------- */
header{position:sticky;top:0;z-index:40;background:rgba(245,247,250,.84);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
nav.tabs{display:flex;gap:var(--space-6);padding:0}
.tab{background:none;border:none;color:var(--ink-dim);font-size:14px;font-weight:500;
  padding:0;height:64px;border-bottom:1.5px solid transparent;
  display:flex;align-items:center;gap:8px;transition:color var(--dur-1)}
.tab .n{font-family:inherit;font-size:var(--text-xs);color:var(--muted);
  font-variant-numeric:tabular-nums}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}

/* ---------- Generic ---------- */
.view{display:none;padding:var(--space-9) 0 var(--space-10);animation:fade .35s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Section head: eyebrow + count on the left, the quiet aside on the right. */
.sec-h{display:flex;align-items:baseline;gap:var(--space-3);margin:0 0 var(--space-5);flex-wrap:wrap}
.sec-h h2{font-size:var(--text-xs);font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent)}
.sec-h .c{font-family:inherit;font-size:var(--text-xs);font-weight:500;color:var(--muted);
  letter-spacing:.06em;font-variant-numeric:lining-nums tabular-nums}
.sec-h .hint{margin-left:auto;font-size:var(--text-sm);color:var(--muted);line-height:1.55}

/* ---------- Trends, scenarios, chains ----------
   No boxes. Each item is an unboxed block in a hairline-ruled grid;
   only the title answers to the pointer. */
.grid{display:grid}
.tg{grid-template-columns:repeat(auto-fill,minmax(288px,1fr));
  gap:0 var(--space-8);border-top:1px solid var(--line-2)}
.card{position:relative;display:flex;flex-direction:column;gap:10px;
  padding:var(--space-5) 0;border-bottom:1px solid var(--line);
  background:none;border-radius:0;cursor:pointer;transition:none}
.card:hover .ttl{color:var(--accent)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:var(--radius-sm)}

/* The old sheet marked kind with a 4px colour stripe down the left
   edge. Kind is already in the heading above each list. */
.card .stripe{display:none}

.card .top{display:flex;align-items:baseline;gap:var(--space-3);margin:0}
.card .dslot{margin-left:auto}
.card .id{font-family:inherit;font-size:var(--text-xs);font-weight:600;color:var(--muted);
  letter-spacing:.06em;font-variant-numeric:tabular-nums}
/* Status is a word, not a capsule. */
.card .st{font-size:var(--text-xs);font-weight:500;letter-spacing:.06em;
  color:var(--muted);padding:0;border-radius:0;background:none!important}
.card .ttl{font-size:var(--text-lg);font-weight:600;line-height:1.35;letter-spacing:-.01em;
  margin:0;transition:color var(--dur-1);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.card .held{margin:0;color:var(--muted);font-size:var(--text-xs);line-height:1.5}
.card .bot{display:flex;align-items:center;gap:var(--space-3)}

/* Meter: 6px track, one filled bar, a dot at the reading. */
.bar{flex:1;height:6px;background:var(--accent-soft);border-radius:3px;border:0;
  overflow:visible;position:relative}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--accent-2)!important}
.bar>u{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;
  background:var(--accent-2);opacity:1;transform:translate(-50%,-50%);
  box-shadow:0 0 0 2px var(--ground)}
.pv{font-family:inherit;font-size:var(--text-md);font-weight:600;min-width:38px;text-align:right;
  font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.01em}

/* Polarity: triangle, then the number. No capsule, no fill. */
.delta{font-family:inherit;font-size:var(--text-xs);font-weight:500;padding:0;border-radius:0;
  background:none!important;color:var(--ink-dim)!important;white-space:nowrap;
  font-variant-numeric:lining-nums tabular-nums;
  display:inline-flex;align-items:center;gap:5px}
.delta::before{content:"";width:0;height:0;
  border-left:4px solid transparent;border-right:4px solid transparent}
.delta.u::before{border-bottom:6px solid var(--up)}
.delta.d::before{border-top:6px solid var(--down)}
.delta.f::before{border-bottom:0;border-top:0;width:8px;height:1px;background:var(--flat)}
.up-badge{font-size:var(--text-xs);font-family:inherit;font-weight:600;letter-spacing:.06em;
  color:var(--accent);border:0;border-radius:0;padding:0}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-9);margin-top:var(--space-10)}
@media(max-width:840px){.cols{grid-template-columns:1fr;gap:var(--space-8)}}
.sgrid{grid-template-columns:1fr;border-top:1px solid var(--line-2)}
#scen-grid .card,
#chain-list .card{gap:8px;padding:var(--space-5) 0}
#scen-grid .card .top,
#chain-list .card .top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;
  align-items:baseline;gap:8px var(--space-3);margin:0}
#scen-grid .card .dslot,
#chain-list .card .dslot{margin-left:0}
#scen-grid .card .ttl,
#chain-list .card .ttl{font-size:var(--text-md);min-height:0;-webkit-line-clamp:3}
#scen-grid .card .held,
#chain-list .card .held{min-height:1.3em;line-height:1.4;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* ---------- Relationship map ---------- */
.gwrap{display:grid;grid-template-columns:1fr 300px;gap:var(--space-8)}
@media(max-width:900px){.gwrap{grid-template-columns:1fr;gap:var(--space-6)}}
.gstage{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);
  position:relative;overflow:hidden;min-height:420px}
#net{display:block;width:100%;height:auto;touch-action:none}
#net text{font-family:inherit;font-variant-numeric:lining-nums}
.gstage .rd{position:absolute;left:var(--space-5);bottom:var(--space-4);right:var(--space-5);
  font-size:var(--text-sm);color:var(--muted);pointer-events:none;line-height:1.55;max-width:72%}
.gstage .rd b{color:var(--ink);font-weight:600}
/* Legend reads as a row of quiet pills over the canvas. */
.glegend{position:absolute;top:var(--space-4);right:var(--space-5);
  display:flex;flex-direction:column;gap:6px;align-items:flex-start;
  font-size:var(--text-xs);color:var(--ink-dim);background:none;padding:0;border:0}
.glegend>*{display:inline-flex;align-items:center;height:28px;padding:0 12px;
  border-radius:var(--radius-pill);background:rgba(255,255,255,.86);
  border:1px solid var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.glegend i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px;
  vertical-align:middle}

.gside h3{font-size:var(--text-xs);font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);margin:0 0 var(--space-3)}
.gside .blk{background:none;border:0;border-top:1px solid var(--line-2);border-radius:0;
  padding:var(--space-5) 0 0;margin:0 0 var(--space-6)}
.gside .blk:first-of-type{border-top:0;padding-top:0}
.rank{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:var(--text-sm);
  border-bottom:1px solid var(--line);cursor:pointer}
.rank:last-child{border-bottom:none}
.rank:hover .rl{color:var(--accent)}
.rank .rn{font-family:inherit;font-size:var(--text-xs);font-weight:600;width:20px;text-align:center;
  border-radius:0;font-variant-numeric:tabular-nums;color:var(--muted)!important;background:none!important}
.rank .rid{font-family:inherit;font-size:var(--text-xs);color:var(--muted);min-width:30px;
  font-variant-numeric:tabular-nums}
.rank .rl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--ink-dim);transition:color var(--dur-1)}
.loop{font-size:var(--text-sm);color:var(--ink-dim);line-height:1.6;padding:10px 0;
  border-bottom:1px solid var(--line)}
.loop:last-child{border:none}
.loop b{color:var(--ink);font-weight:600}
.loop .new{font-family:inherit;font-size:var(--text-xs);font-weight:600;color:var(--accent);
  border:0;border-radius:0;padding:0;margin-left:6px;letter-spacing:.06em}
/* The one filled note on the page: it carries the map's headline. */
.hub{background:var(--accent-wash);border:0;border-left:2px solid var(--accent);
  border-radius:0;padding:var(--space-4) var(--space-5);margin:0 0 var(--space-6);
  font-size:var(--text-sm);line-height:1.65;color:var(--ink-dim)}
.hub b{color:var(--accent);font-weight:600}

/* ---------- Drill-in sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(14,26,43,.28);backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;transition:opacity var(--dur-2);z-index:60}
.scrim.on{opacity:1;pointer-events:auto}
.drill{position:fixed;top:0;right:0;bottom:0;width:min(600px,94vw);background:var(--surface);
  border-left:0;transform:translateX(102%);transition:transform var(--dur-2) var(--ease);
  z-index:70;overflow-y:auto;box-shadow:var(--shadow-3)}
.drill.on{transform:none}
.dhead{padding:var(--space-5) var(--space-6) var(--space-4);border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--surface);z-index:2}
.dhead .krow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.badge{font-family:inherit;font-size:var(--text-xs);font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;padding:0;border:0;border-radius:0;color:var(--muted)}
.dhead .did{font-family:inherit;font-size:var(--text-xs);font-weight:600;color:var(--accent);
  letter-spacing:.06em;font-variant-numeric:tabular-nums}
.dclose{margin-left:auto;background:var(--surface-2);border:0;color:var(--ink-dim);
  width:36px;height:36px;border-radius:50%;font-size:16px;line-height:1;
  display:flex;align-items:center;justify-content:center;transition:background var(--dur-1),color var(--dur-1)}
.dclose:hover{background:var(--accent-soft);color:var(--accent)}
.dhead h2{font-size:var(--text-xl);line-height:1.3;margin-bottom:var(--space-4)}
.dmetrics{display:flex;gap:var(--space-6);align-items:flex-end;flex-wrap:wrap}
.dmetrics .m b{font-family:inherit;font-size:30px;font-weight:600;line-height:1;letter-spacing:-.02em}
.dmetrics .m span{display:block;font-size:var(--text-xs);color:var(--muted);margin-top:6px;
  letter-spacing:.06em}
.dbody{padding:var(--space-5) var(--space-6) var(--space-9)}
.field{margin-bottom:var(--space-5)}
.field .fl{font-size:var(--text-xs);font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.field .fl::before{content:"";width:14px;height:1px;background:var(--accent)}
.field p{margin:0;font-size:var(--text-base);color:var(--ink);line-height:1.75}
.field.mech p{color:var(--ink-dim)}
.field table{width:100%;border-collapse:collapse;font-size:var(--text-sm);margin:10px 0}
.field td,.field th{border:0;border-bottom:1px solid var(--line);padding:8px 10px 8px 0;
  text-align:left;vertical-align:top;color:var(--ink-dim)}
.field th{color:var(--muted);font-weight:600;font-size:var(--text-xs);letter-spacing:.06em;
  text-transform:uppercase}
.field.log p{color:var(--ink-dim);font-size:var(--text-sm);background:var(--surface-2);
  border:0;border-radius:var(--radius-md);padding:var(--space-4);line-height:1.7}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font-family:inherit;font-size:13px;font-weight:500;height:28px;padding:0 12px;
  display:inline-flex;align-items:center;border-radius:var(--radius-pill);
  background:var(--surface);border:1px solid var(--line-2);color:var(--ink-dim);cursor:pointer;
  transition:border-color var(--dur-1),color var(--dur-1)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.dis{cursor:default}
.chip.dis:hover{border-color:var(--line-2);color:var(--ink-dim)}

footer{border-top:1px solid var(--line);padding:var(--space-7) 0 var(--space-9);
  font-size:var(--text-sm);color:var(--muted);line-height:1.75}
footer b{color:var(--ink-dim);font-weight:600}

@media(max-width:719px){
  .wrap{padding-inline:20px}
  nav.tabs{gap:var(--space-5);overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  .tab{height:56px;flex:0 0 auto}
  .view{padding:var(--space-7) 0 var(--space-9)}
  .sec-h{align-items:flex-start;margin-bottom:var(--space-4)}
  .sec-h .hint{width:100%;margin-left:0}
  .tg{grid-template-columns:1fr;gap:0}
  .card{padding:var(--space-4) 0}
  .card .ttl{font-size:var(--text-md);min-height:0}
  .cols{margin-top:var(--space-8);gap:var(--space-7)}
  .gstage{min-height:min(70dvh,36rem)}
  .gstage .rd{max-width:65%}
  .glegend{top:12px;right:12px}
  .drill{width:100%}
  .dhead{padding:var(--space-4)}
  .dclose{width:44px;height:44px;font-size:19px}
  .dbody{padding:var(--space-4) var(--space-4) var(--space-8)}
  .chip{min-height:36px;height:auto;padding:6px 12px}
}
</style>
<style>
/* ---------- loading state + shared panel rendering ---------- */
#boot{position:fixed;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;
  background:var(--ground);z-index:99;font-family:inherit;font-size:13px;color:var(--muted);text-align:center;padding:24px}
#boot .err{color:var(--st-fals);max-width:520px;line-height:1.6}
</style>
</head>
<body>
<div id="boot">Loading the model...</div>

<header>
  <div class="wrap">
    <nav class="tabs" role="tablist">
      <button class="tab on" data-v="ov" role="tab"><span>Overview</span></button>
      <button class="tab" data-v="gr" role="tab"><span>Relationship map</span></button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="view on" id="v-ov">
    <div class="sec-h"><h2>Trends</h2><span class="c" id="tc"></span><span class="hint">Model snapshot from 29 August 2026</span></div>
    <div class="grid tg" id="trend-grid"></div>
    <div class="cols">
      <div class="scen">
        <div class="sec-h"><h2>Scenarios</h2><span class="c" id="sc"></span></div>
        <div class="grid sgrid" id="scen-grid"></div>
      </div>
      <div>
        <div class="sec-h"><h2>Chains</h2><span class="c" id="cc"></span></div>
        <div class="grid sgrid" id="chain-list"></div>
      </div>
    </div>
  </section>

  <section class="view" id="v-gr">
    <div class="sec-h"><h2>Relationship map</h2><span class="c" id="gcount"></span>
      <span class="hint">Drag to rearrange. Hover to trace a path. Click to inspect.</span></div>
    <div class="gwrap">
      <div class="gstage">
        <div class="glegend" id="glegend"></div>
        <svg id="net" viewBox="0 0 900 620" role="img" aria-label="Map of relationships between trends"></svg>
        <div class="rd" id="rd"></div>
      </div>
      <div class="gside">
        <div class="hub" id="hub"></div>
        <div class="blk"><h3>Where pressures converge</h3><div id="indeg"></div></div>
        <div class="blk"><h3>What drives the system</h3><div id="outdeg"></div></div>
        <div class="blk"><h3>Closed loops</h3><div id="loops"></div></div>
      </div>
    </div>
  </section>


  <footer id="foot"></footer>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drill" id="drill" aria-hidden="true"></aside>

<script>
/* ===================== bootstrap: fetch the snapshot data ===================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
async function boot(){
  try{
    const res=await fetch("./data.json",{cache:"no-store"});
    if(!res.ok)throw new Error("HTTP "+res.status);
    const data=await res.json();
    $("#boot").remove();
    render(data);
  }catch(err){
    $("#boot").innerHTML=`<div class="err">Could not load data.json: ${esc(err.message)}<br>
      This page reads its data from data.json next to it.<br>
      Open it over HTTP rather than from the local file system.</div>`;
  }
}

/* ===================== render ===================== */
function render(DATA){
const M=DATA.meta;
const STc={"Emerging":"var(--st-emerging)","Strengthening":"var(--st-strength)","Mainstream":"var(--st-main)","Loosening":"var(--st-loose)","Falsified":"var(--st-fals)"};
const fmt=p=>p==null?"Not set":p.toFixed(2);
/* The mark is drawn by `.delta::before`, so the polarity colour sits on the
   triangle while the number stays in the ink ramp. Emitting a ▲/▼/■ glyph here
   as well would print two marks. */
const dchip=d=>{const s=d>0?"u":d<0?"d":"f";
  const t=d===0?"held":(d>0?"+":"")+d.toFixed(2);return `<span class="delta ${s}">${t}</span>`;};
const ago=iso=>{if(!iso)return"";const d=(new Date(M.asof)-new Date(iso))/864e5;
  return d<=0?"this week":d<=7?"last week":Math.round(d/7)+" weeks ago";};
const heldLabel=o=>o.lastMoved?"last changed "+ago(o.lastMoved):"latest note "+(o.logDate||"not dated");

const ALL=[...DATA.trends,...DATA.scenarios,...DATA.chains,...DATA.couplings];
const IDX={};ALL.forEach(o=>IDX[o.id]=o);

const cardHTML=(o,c,extra="",alwaysHeld=false,inlineTitle=false)=>`<article class="card${o.delta?" moved":""}" tabindex="0" data-id="${o.id}">
    <span class="stripe" style="background:${c}"></span>
    <div class="top"><span class="id">${o.id}</span>${extra}
      ${inlineTitle?`<div class="ttl">${esc(o.title)}</div>`:""}
      <span class="dslot">${dchip(o.delta)}</span></div>
    ${inlineTitle?"":`<div class="ttl">${esc(o.title)}</div>`}
    <div class="bot"><div class="bar"><i style="width:${o.prob*100}%;background:${c}"></i>${o.delta?`<u style="left:${o.prev*100}%"></u>`:""}</div>
      <span class="pv">${fmt(o.prob)}</span></div>
    ${(!o.delta||alwaysHeld)?`<div class="held">${o.delta?"":heldLabel(o)}</div>`:""}
  </article>`;

/* trends */
$("#tc").textContent=DATA.trends.length;
$("#trend-grid").innerHTML=DATA.trends.slice().sort((a,b)=>b.prob-a.prob).map(t=>{
  const c=STc[t.status]||"var(--muted)";
  const extra=`<span class="st" style="color:${c};background:color-mix(in srgb,${c} 15%,transparent)">${t.status}</span>
      ${t.upgraded?'<span class="up-badge">↑ promoted</span>':''}`;
  return cardHTML(t,c,extra);
}).join("");

/* scenarios and chains share the trend card: id, delta, title, bar + value */
$("#sc").textContent=DATA.scenarios.length;
$("#scen-grid").innerHTML=DATA.scenarios.slice().sort((a,b)=>b.prob-a.prob)
  .map(s=>cardHTML(s,"var(--mark-scen)","",true,true)).join("");
$("#cc").textContent=DATA.chains.length;
$("#chain-list").innerHTML=DATA.chains.slice().sort((a,b)=>b.prob-a.prob)
  .map(c=>cardHTML(c,"var(--mark-chain)","",true,true)).join("");

/* ---------- graph ---------- */
const G=DATA.graph;
const cls=n=>n.bottleneck?"bottleneck":n.driver?"driver":({trend:"trend",scen:"scen",pattern:"pat"}[n.kind]||"ext");
const NC={bottleneck:"var(--bottleneck)",driver:"var(--driver)",trend:"var(--ink-dim)",scen:"var(--accent)",pat:"var(--pat)",ext:"var(--ext)"};
$("#glegend").innerHTML=[["bottleneck","Convergence point"],["driver","System driver"],["trend","Trend"],["scen","Scenario"],["pat","Pattern"],["ext","External factor"]]
  .map(([k,l])=>`<span><i style="background:${NC[k]}"></i>${l}</span>`).join("");
$("#gcount").textContent=M.active_couplings+" couplings · "+G.edges.length+" edges · "+G.nodes.length+" nodes";
$("#hub").innerHTML=G.hub
  ?`<b>Structural hub ${G.hub.id}</b><br>${esc(G.hub.label.replace(G.hub.id,"").trim())}<br>${G.hub.indeg} incoming and ${G.hub.outdeg} outgoing relationships. This is where the most paths meet and continue.`
  :"No structural hub found.";

const W=900,H=620,PAD=48;
let N=G.nodes.map(n=>({...n,cls:cls(n),deg:n.indeg+n.outdeg}));
const nById={};N.forEach(n=>nById[n.id]=n);
const E=G.edges.filter(e=>nById[e.src]&&nById[e.dst]);
N.sort((a,b)=>b.deg-a.deg);
N.forEach((n,i)=>{const a=i*2.399963,r=Math.sqrt(i/N.length)*Math.min(W,H)*0.42;
  n.x=W/2+Math.cos(a)*r;n.y=H/2+Math.sin(a)*r;n.vx=0;n.vy=0;});
for(let it=0;it<440;it++){
  const k=1-it/580;
  for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){
    const dx=N[i].x-N[j].x,dy=N[i].y-N[j].y,d2=dx*dx+dy*dy+0.01,d=Math.sqrt(d2),f=5400/d2;
    N[i].vx+=f*dx/d*k;N[i].vy+=f*dy/d*k;N[j].vx-=f*dx/d*k;N[j].vy-=f*dy/d*k;}
  E.forEach(e=>{if(e.src===e.dst)return;const a=nById[e.src],b=nById[e.dst];const dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)+0.01,f=(d-118)*0.028;
    a.vx+=f*dx/d;a.vy+=f*dy/d;b.vx-=f*dx/d;b.vy-=f*dy/d;});
  N.forEach(n=>{n.vx+=(W/2-n.x)*0.006;n.vy+=(H/2-n.y)*0.006;
    n.x+=n.vx*0.82;n.y+=n.vy*0.82;n.vx*=0.86;n.vy*=0.86;
    n.x=Math.max(PAD,Math.min(W-PAD,n.x));n.y=Math.max(PAD,Math.min(H-PAD,n.y));});}
const svg=$("#net"),SVGNS="http://www.w3.org/2000/svg";
const el=(t,a)=>{const e=document.createElementNS(SVGNS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
const defs=el("defs",{});
defs.innerHTML='<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--line-2)"/></marker>';
svg.appendChild(defs);
const gE=el("g",{}),gN=el("g",{});svg.appendChild(gE);svg.appendChild(gN);
const rad=n=>9+n.deg*2.3;
const edgeEls=E.map(e=>{
  if(e.src===e.dst){const c=el("circle",{fill:"none",stroke:"var(--line-2)","stroke-width":1.5,opacity:.55,r:16});c._e=e;c._self=1;gE.appendChild(c);return c;}
  const ln=el("line",{stroke:"var(--line-2)","stroke-width":e.meta?1:1.5,
  "stroke-dasharray":e.meta?"3 3":"","marker-end":"url(#ar)",opacity:.55});ln._e=e;gE.appendChild(ln);return ln;});
const nodeEls=N.map(n=>{const g=el("g",{style:"cursor:pointer"});g._n=n;g.classList.add("gn");
  const c=el("circle",{r:rad(n),stroke:NC[n.cls],"stroke-width":(n.bottleneck||n.driver)?2.5:1.5,
    fill:(n.bottleneck||n.driver)?"color-mix(in srgb,"+NC[n.cls]+" 22%,var(--surface))":"var(--surface-2)"});
  const tx=el("text",{"text-anchor":"middle",dy:"0.34em","font-size":n.deg>2?11:9.5,"font-family":"inherit",
    fill:(n.bottleneck||n.driver)?NC[n.cls]:"var(--ink-dim)","font-weight":600,"pointer-events":"none"});
  tx.textContent=n.id.length<=7?n.id:n.label.slice(0,4);
  g.appendChild(c);g.appendChild(tx);gN.appendChild(g);return g;});
function place(){edgeEls.forEach(ln=>{const e=ln._e,a=nById[e.src],b=nById[e.dst];
  if(ln._self){ln.setAttribute("cx",a.x+rad(a)+8);ln.setAttribute("cy",a.y-rad(a)-2);return;}
  const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,rb=rad(b)+3;
  ln.setAttribute("x1",a.x);ln.setAttribute("y1",a.y);
  ln.setAttribute("x2",b.x-dx/d*rb);ln.setAttribute("y2",b.y-dy/d*rb);});
  nodeEls.forEach(g=>g.setAttribute("transform","translate("+g._n.x+","+g._n.y+")"));}
place();
const RD='Hover over a node to trace its relationships. <b>Red</b> marks convergence points. <b>Blue</b> marks systemic drivers. Dashed lines show meta relationships.';
$("#rd").innerHTML=RD;
function focus(n){const nb=new Set([n.id]);E.forEach(e=>{if(e.src===n.id)nb.add(e.dst);if(e.dst===n.id)nb.add(e.src);});
  nodeEls.forEach(g=>g.style.opacity=nb.has(g._n.id)?1:.18);
  edgeEls.forEach(ln=>{const on=ln._e.src===n.id||ln._e.dst===n.id;
    ln.setAttribute("opacity",on?.95:.06);ln.setAttribute("stroke",on?"var(--accent)":"var(--line-2)");
    ln.setAttribute("stroke-width",on?2:(ln._e.meta?1:1.5));});
  const outs=E.filter(e=>e.src===n.id),ins=E.filter(e=>e.dst===n.id);
  $("#rd").innerHTML=`<b>${n.id}</b> ${esc(n.label.replace(n.id,"").trim())}<br>${n.indeg} incoming and ${n.outdeg} outgoing relationships`
    +(outs.length?"<br>Drives: "+outs.map(e=>`<b>${e.dst}</b> (${e.cid})`).join(", "):"")
    +(ins.length?"<br>Driven by: "+ins.map(e=>`<b>${e.src}</b> (${e.cid})`).join(", "):"");}
function blur(){nodeEls.forEach(g=>g.style.opacity=1);
  edgeEls.forEach(ln=>{ln.setAttribute("opacity",.55);ln.setAttribute("stroke","var(--line-2)");
    ln.setAttribute("stroke-width",ln._e.meta?1:1.5);});$("#rd").innerHTML=RD;}
let drag=null;
const pt=ev=>{const r=svg.getBoundingClientRect(),cx=ev.touches?ev.touches[0].clientX:ev.clientX,
  cy=ev.touches?ev.touches[0].clientY:ev.clientY;return{x:(cx-r.left)/r.width*W,y:(cy-r.top)/r.height*H};};
nodeEls.forEach(g=>{
  g.addEventListener("mouseenter",()=>{if(!drag)focus(g._n);});
  g.addEventListener("mouseleave",()=>{if(!drag)blur();});
  g.addEventListener("mousedown",ev=>{drag=g._n;ev.preventDefault();});
  g.addEventListener("touchstart",()=>{drag=g._n;focus(g._n);},{passive:true});
  g.addEventListener("click",()=>{if(IDX[g._n.id])openDrill(g._n.id);});});
addEventListener("mousemove",ev=>{if(drag){const p=pt(ev);drag.x=p.x;drag.y=p.y;place();}});
addEventListener("touchmove",ev=>{if(drag){const p=pt(ev);drag.x=p.x;drag.y=p.y;place();}},{passive:true});
addEventListener("mouseup",()=>{if(drag){drag=null;blur();}});
addEventListener("touchend",()=>{if(drag){drag=null;blur();}});

const rankRows=k=>N.filter(n=>n[k]>0).sort((a,b)=>b[k]-a[k]).slice(0,5).map(n=>{
  const col=k==="indeg"?"var(--bottleneck)":"var(--driver)";
  return `<div class="rank" data-id="${n.id}"><span class="rn" style="color:${col};background:color-mix(in srgb,${col} 15%,transparent)">${n[k]}</span>
    <span class="rid">${n.id}</span><span class="rl">${esc(n.label.replace(n.id,"").trim())}</span></div>`;}).join("");
$("#indeg").innerHTML=rankRows("indeg");
$("#outdeg").innerHTML=rankRows("outdeg");
/* Closed loops: directed cycles detected from the graph structure + the "closed loop detection" section declared in each chain file */
$("#loops").innerHTML=[
  ...(G.loops||[]).map(l=>`<div class="loop"><b>Feedback loop${l.nodes.length===2&&l.nodes[0]===l.nodes[1]?" within one node":""}</b> ${
    l.nodes.map((n,i)=>i<l.cids.length?`${esc(n)} →(${l.cids[i]}) `:esc(n)).join("")}</div>`),
  ...DATA.chains.filter(c=>c.loop).map(c=>`<div class="loop"><b>${c.id} · ${esc(c.loop)}</b><br>${esc(c.story)}</div>`)
].join("")||'<div class="loop">No feedback loop found.</div>';


$("#foot").innerHTML=`Snapshot from 29 August 2026. Each probability records the model's current confidence in a thesis.`;

/* ---------- drill ---------- */
const drill=$("#drill"),scrim=$("#scrim");
const relChip=id=>{const o=IDX[id];return `<span class="chip${o?'':' dis'}" ${o?`data-id="${id}"`:''}>${id}</span>`;};
function showDrill(){drill.classList.add("on");scrim.classList.add("on");drill.setAttribute("aria-hidden","false");
  $(".dclose",drill).onclick=closeDrill;drill.scrollTop=0;}
function openDrill(id){const o=IDX[id];if(!o)return;
  const kind={trend:"TREND",scenario:"SCENARIO",chain:"CHAIN",coupling:"COUPLING"}[o.kind];
  const c=o.kind==="trend"?(STc[o.status]||"var(--accent)"):"var(--accent)";
  /* Body text is plain prose apart from the occasional pipe table, which is
     rendered as a table rather than escaped into a row of literal pipes. */
  const rich=v=>{const out=[];let tbl=null;
    const flush=()=>{if(tbl){out.push("<table>"+tbl.map((r,i)=>"<tr>"+r.map(c=>i===0?`<th>${c}</th>`:`<td>${c}</td>`).join("")+"</tr>").join("")+"</table>");tbl=null;}};
    for(const raw of String(v).split("\n")){const t=raw.trim();
      if(/^\|.*\|$/.test(t)){const cells=t.replace(/^\||\|$/g,"").split("|").map(c=>esc(c.trim()));
        if(cells.every(c=>/^[-: ]*$/.test(c)))continue;(tbl??=[]).push(cells);continue;}
      flush();out.push(esc(raw)+"<br>");}
    flush();return out.join("").replace(/(<br>)+$/,"");};
  const f=(l,v,cl="")=>v?`<div class="field ${cl}"><div class="fl">${l}</div><p>${rich(v)}</p></div>`:"";
  let metrics="",body="";
  if(o.kind==="coupling"){
    metrics=`<div class="dmetrics"><div class="m"><b style="font-size:18px">${esc(o.frm)} → ${esc(o.to)}</b><span>Direction</span></div>
      <div class="m"><b style="font-size:18px;color:var(--accent)">${o.strength||"Not set"}</b><span>Strength</span></div></div>`;
    body=f("Claim",o.cause)+f("How the change travels",o.mechanism,"mech")
      +`<div class="field"><div class="fl">Type</div><div class="chips"><span class="chip dis">${(o.type||"").replace("_"," ")}</span>${o.candidate?'<span class="chip dis">under review</span>':""}</div></div>`;
  }else{
    const sub=o.kind==="chain"?"Progress":"Probability";
    metrics=`<div class="dmetrics">
      <div class="m"><b style="color:${c}">${fmt(o.prob)}</b><span>${sub}</span></div>
      ${o.kind==="trend"?`<div class="m"><b style="font-size:15px;color:${c}">${o.status}</b><span>Status${o.upgraded?", promoted this week":""}</span></div>`:""}
      <div class="m"><b style="font-size:19px;color:${o.delta>0?'var(--up)':o.delta<0?'var(--down)':'var(--flat)'}">${
        o.delta===0?"held":(o.delta>0?"+":"")+o.delta.toFixed(2)}</b><span>${
        o.delta?`this week, previously ${o.prev.toFixed(2)}`:`held this week, ${heldLabel(o)}`}</span></div></div>`;
    if(o.kind==="trend") body=f("Thesis",o.oneliner)+f("Mechanism",o.mechanism,"mech")+f("Analogy",o.analogy,"mech")
      +(o.dclass?`<div class="field"><div class="fl">Falsifier registry</div><div class="chips">${
        o.dclass.split("+").map(x=>`<span class="chip dis">Class ${x.trim()}</span>`).join("")}<span class="chip dis">${o.nsrc} primary sources</span></div></div>`:"")
      +((o.rel_scen.length||o.rel_coup.length)?`<div class="field"><div class="fl">Related objects</div><div class="chips">${
        o.rel_scen.map(relChip).join("")}${o.rel_coup.map(relChip).join("")}</div></div>`:"");
    else if(o.kind==="scenario") body=f("Scenario",o.oneliner)+f("What would change this view",o.falsify,"mech")
      +(o.rel_chain.length?`<div class="field"><div class="fl">Supporting chains</div><div class="chips">${o.rel_chain.map(relChip).join("")}</div></div>`:"");
    else body=f("Chain",o.story)+f("Main constraint",o.bottleneck,"mech")
      +(o.loop?`<div class="field"><div class="fl">Closed loops</div><div class="chips"><span class="chip dis">${o.loop}</span></div></div>`:"")
      +(o.rel_scen.length?`<div class="field"><div class="fl">Scenarios reinforced</div><div class="chips">${o.rel_scen.map(relChip).join("")}</div></div>`:"");
    if(o.lastLog) body+=f("Latest update, "+o.logDate,o.lastLog,"log");
  }
  drill.innerHTML=`<div class="dhead"><div class="krow"><span class="badge">${kind}</span><span class="did">${o.id}</span>
    <button class="dclose" aria-label="Close">✕</button></div><h2>${esc(o.title)}</h2>${metrics}</div><div class="dbody">${body}</div>`;
  showDrill();}
function closeDrill(){drill.classList.remove("on");scrim.classList.remove("on");drill.setAttribute("aria-hidden","true");}
scrim.onclick=closeDrill;
addEventListener("keydown",e=>{if(e.key==="Escape")closeDrill();});
addEventListener("click",e=>{const h=e.target.closest("[data-id]");
  if(!h||e.target.closest(".gn"))return;const id=h.getAttribute("data-id");if(IDX[id])openDrill(id);});
addEventListener("keydown",e=>{if(e.key!=="Enter")return;const h=e.target.closest("[data-id]");
  if(h&&IDX[h.getAttribute("data-id")])openDrill(h.getAttribute("data-id"));});

$$(".tab").forEach(b=>b.onclick=()=>{$$(".tab").forEach(x=>x.classList.remove("on"));b.classList.add("on");
  $$(".view").forEach(v=>v.classList.remove("on"));$("#v-"+b.dataset.v).classList.add("on");scrollTo({top:0});});
}
boot();
</script>
</body></html>
