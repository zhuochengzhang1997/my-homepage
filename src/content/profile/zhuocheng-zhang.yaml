biography:
  sourceText: >-
    Zhuocheng Zhang is a postdoctoral researcher at The Chinese University of
    Hong Kong, working on AI agents for semiconductor compact modeling. Before
    that he was a senior device engineer at HiSilicon and earned his Ph.D. in
    microelectronics at Purdue University.
  # One paragraph per column of the Home Background arc, and the arc is the
  # constraint: each answers exactly one question and none leaks the next one's
  # answer. 1 establishes hands-on device and fab experience. 2 names the
  # repeated manual loops and why agents are relevant. 3 states the current
  # work, its first application, and the broader goal without claiming that the
  # entire semiconductor workflow is already automated.
  paragraphs:
    - >-
      I spent more than 5,000 hours in Purdue cleanrooms, fabricating
      oxide-semiconductor transistors and learning the full loop from process
      design to electrical measurement. At HiSilicon, I took a vertical
      gate-all-around device architecture through a 300-mm production fab,
      working from simulation and process integration to silicon data.
    - >-
      Semiconductor development still depends on manual loops: triaging test
      data, recalibrating models as new silicon arrives, and reconstructing
      decisions that were never captured. The work is repetitive, but it still
      consumes expert time and slows the next iteration. I moved toward AI
      because agents can take on the repeatable execution while engineers
      retain judgment, review, and accountability.
    - >-
      At CUHK, I build and evaluate agent systems for semiconductor engineering,
      starting with compact modeling. I focus on the tools, physical
      constraints, and evidence trails that keep an agent’s work controlled and
      auditable. The goal is to automate repeatable parts of semiconductor
      workflows and shorten engineering cycles without giving up physical rigor
      or engineering control.
